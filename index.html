<!DOCTYPE html>
<html lang="en" data-theme="aes">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Investomania | Alpha Entrepreneurship Summit (AES 2026) · Alpha College Karachi</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/InvestomaniaLogo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Instrument+Serif:ital@0;1&family=Nunito:wght@500;600;700;800&family=Outfit:ital,wght@0,400;0,500;0,600;0,700;1,600;1,700&family=Playfair+Display:ital,wght@1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        try {
          var saved = sessionStorage.getItem('investomania_theme') || 'aes';
          document.documentElement.setAttribute('data-theme', saved);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'aes');
        }
      })();
    </script>
    <style>
      /* Immediate background setup prevents white screen flash on refresh */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #5A0D1B;
        color: #F8EEE1;
      }
      html[data-theme="light"], html[data-theme="light"] body {
        background-color: #FFFDFC;
        color: #24070D;
      }
      html[data-theme="dark"], html[data-theme="dark"] body {
        background-color: #0D0407;
        color: #F7F2EA;
      }
      html[data-theme="aes"], html[data-theme="aes"] body {
        background-color: #5A0D1B;
        color: #F8EEE1;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
